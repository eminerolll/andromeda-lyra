<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giriş</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#D97757" />
    <link rel="stylesheet" href="/css/fonts.css" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Palet /css/tokens.css'ten gelir — bu sayfanin kendi :root'u kaldirildi. */

      html,
      body {
        height: 100%;
      }

      body {
        font-family: var(--sans);
        background: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* animated background */
      .bg-grid {
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, black, transparent);
        pointer-events: none;
      }

      .bg-glow {
        position: fixed;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.07;
        pointer-events: none;
        animation: float 15s ease-in-out infinite alternate;
      }
      .bg-glow.a {
        background: var(--accent);
        top: -20%;
        left: -10%;
      }
      .bg-glow.b {
        background: var(--kraft);
        bottom: -20%;
        right: -10%;
        animation-delay: -7s;
      }

      @keyframes float {
        0% {
          transform: translate(0, 0) scale(1);
        }
        100% {
          transform: translate(40px, -30px) scale(1.15);
        }
      }

      /* container */
      .container {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 420px;
        padding: 24px;
      }

      /* logo */
      .brand {
        text-align: center;
        margin-bottom: 40px;
        animation: fadeDown 0.8s ease;
      }

      .brand-icon {
        width: 52px;
        height: 52px;
        margin: 0 auto 16px;
        position: relative;
      }

      .brand-icon .ring {
        position: absolute;
        inset: -4px;
        border-radius: 18px;
        border: 1px solid transparent;
        background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.3), transparent 60%)
          border-box;
        mask:
          linear-gradient(#fff 0 0) padding-box,
          linear-gradient(#fff 0 0);
        mask-composite: exclude;
        -webkit-mask-composite: xor;
        animation: spin 8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .brand-icon .inner {
        width: 100%;
        height: 100%;
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Marka isaretinin geometrisi SVG attribute'larinda: stroke 3.0, yuvarlak
         uclar, dolu nokta. Buradan stroke-width/fill ezilirse isaret incelir ve
         "E.E"yi okunur kilan nokta kaybolur — CSS yalnizca olcu ve renk verir. */
      .brand-icon svg {
        width: 28px;
        height: 28px;
        color: var(--accent);
      }

      .brand-name {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 5px;
        text-transform: uppercase;
        color: var(--text-dim);
      }

      /* card */
      .card {
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        padding: 40px 36px;
        position: relative;
        overflow: hidden;
        animation: fadeUp 0.6s ease;
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.4),
          0 0 0 0 rgba(var(--accent-rgb), 0);
        transition: box-shadow 0.4s ease;
      }

      .card:focus-within {
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.4),
          0 0 40px rgba(var(--accent-rgb), 0.06);
      }

      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent 10%,
          rgba(var(--accent-rgb), 0.4) 50%,
          transparent 90%
        );
      }

      .card-title {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.3px;
      }

      .card-desc {
        font-size: 14px;
        color: var(--text-dim);
        margin-top: 6px;
        margin-bottom: 32px;
        line-height: 1.5;
      }

      /* steps */
      .step {
        display: none;
      }
      .step.active {
        display: block;
        animation: fadeUp 0.4s ease;
      }

      /* form */
      .field {
        margin-bottom: 20px;
      }

      .field-label {
        display: block;
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--text-dim);
        margin-bottom: 8px;
      }

      .field-input {
        width: 100%;
        padding: 14px 16px;
        background: var(--bg);
        border: 1.5px solid var(--card-border);
        border-radius: 12px;
        color: var(--text);
        font-family: var(--mono);
        font-size: 15px;
        outline: none;
        transition:
          border-color 0.25s,
          box-shadow 0.25s,
          background 0.25s;
      }

      .field-input:focus {
        border-color: rgba(var(--accent-rgb), 0.5);
        box-shadow: 0 0 0 4px rgba(var(--accent-rgb), 0.08);
        background: rgba(var(--accent-rgb), 0.02);
      }

      .field-input::placeholder {
        color: var(--text-faint);
        font-weight: 400;
      }

      /* 2FA code input */
      .code-input {
        text-align: center;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 12px;
        padding: 16px;
      }

      /* button */
      .btn {
        width: 100%;
        padding: 14px;
        margin-top: 4px;
        background: var(--accent);
        color: var(--bg);
        border: none;
        border-radius: 12px;
        font-family: var(--sans);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition:
          transform 0.15s,
          opacity 0.2s;
      }

      .btn:hover {
        opacity: 0.9;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none;
      }

      .btn .loader {
        display: none;
        width: 18px;
        height: 18px;
        border: 2px solid rgba(var(--bg-rgb), 0.25);
        border-top-color: var(--bg);
        border-radius: 50%;
        animation: rotate 0.6s linear infinite;
        margin: 0 auto;
      }

      .btn.loading .label {
        visibility: hidden;
      }
      .btn.loading .loader {
        display: block;
        position: absolute;
        top: 50%;
        left: 50%;
        margin: -9px 0 0 -9px;
      }

      @keyframes rotate {
        to {
          transform: rotate(360deg);
        }
      }

      /* error */
      .error-box {
        margin-top: 16px;
        padding: 12px 16px;
        background: var(--red-soft);
        border: 1px solid rgba(201, 65, 79, 0.25);
        border-radius: 10px;
        font-size: 13px;
        color: var(--danger);
        display: none;
        align-items: center;
        gap: 8px;
      }

      .error-box.show {
        display: flex;
        animation: shake 0.35s ease;
      }
      .error-box svg {
        width: 16px;
        height: 16px;
        stroke: var(--danger);
        fill: none;
        stroke-width: 2;
        flex-shrink: 0;
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-8px);
        }
        40% {
          transform: translateX(6px);
        }
        60% {
          transform: translateX(-4px);
        }
        80% {
          transform: translateX(2px);
        }
      }

      /* back link for 2FA */
      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--text-dim);
        text-decoration: none;
        cursor: pointer;
        margin-bottom: 20px;
        transition: color 0.2s;
      }
      .back-link:hover {
        color: var(--text);
      }
      .back-link svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
      }

      /* animations */
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeDown {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* responsive */
      @media (max-width: 480px) {
        .card {
          padding: 32px 24px;
          border-radius: 16px;
        }
        .container {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-grid"></div>
    <div class="bg-glow a"></div>
    <div class="bg-glow b"></div>

    <div class="container">
      <div class="brand">
        <div class="brand-icon">
          <div class="ring"></div>
          <div class="inner">
            <svg viewBox="0 0 32 32" role="img" aria-label="Lyra">
              <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
                <path d="M5 7V25" />
                <path d="M5 7H13" />
                <path d="M5 16H11.9" />
                <path d="M5 25H13" />
                <path d="M19.6 7V25" />
                <path d="M19.6 7H27.6" />
                <path d="M19.6 16H26.5" />
                <path d="M19.6 25H27.6" />
              </g>
              <circle cx="16.3" cy="25" r="1.7" fill="currentColor" />
            </svg>
          </div>
        </div>
        <div class="brand-name" id="brandName">LYRA</div>
      </div>

      <div class="card">
        <!-- Step 1: Password -->
        <div class="step active" id="stepPassword">
          <div class="card-title">Hoş geldin</div>
          <div class="card-desc">Devam etmek için şifreni gir</div>
          <form id="passwordForm" autocomplete="off">
            <div class="field">
              <label class="field-label">Kullanıcı Adı</label>
              <input
                type="text"
                class="field-input"
                id="username"
                placeholder="admin"
                autocomplete="username"
                autofocus
                required
              />
            </div>
            <div class="field">
              <label class="field-label">Şifre</label>
              <input
                type="password"
                class="field-input"
                id="password"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              />
            </div>
            <button type="submit" class="btn" id="btnPassword">
              <span class="label">Giriş Yap</span>
              <div class="loader"></div>
            </button>
          </form>
        </div>

        <!-- Step 2: 2FA -->
        <div class="step" id="step2FA">
          <a class="back-link" onclick="goBack()">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6" /></svg>
            Geri
          </a>
          <div class="card-title">Doğrulama</div>
          <div class="card-desc">Authenticator uygulamanızdaki 6 haneli kodu girin</div>
          <form id="totpForm" autocomplete="off">
            <div class="field">
              <label class="field-label">Doğrulama Kodu</label>
              <input
                type="text"
                class="field-input code-input"
                id="totp"
                placeholder="000000"
                maxlength="6"
                inputmode="numeric"
                pattern="[0-9]*"
                autocomplete="one-time-code"
                required
              />
            </div>
            <button type="submit" class="btn" id="btn2FA">
              <span class="label">Doğrula</span>
              <div class="loader"></div>
            </button>
          </form>
        </div>

        <div class="error-box" id="error">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
          <span id="errorText"></span>
        </div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      let savedPassword = "";
      let savedUsername = "";

      fetch("/api/branding")
        .then((r) => (r.ok ? r.json() : null))
        .then((b) => {
          if (b && b.appName) {
            $("brandName").textContent = b.appName.toUpperCase();
            document.title = "Giriş — " + b.appName;
          }
        })
        .catch(() => {});

      function showError(msg) {
        $("errorText").textContent = msg;
        $("error").classList.add("show");
      }

      function hideError() {
        $("error").classList.remove("show");
      }

      function setLoading(btn, on) {
        btn.classList.toggle("loading", on);
        btn.disabled = on;
      }

      function goBack() {
        $("step2FA").classList.remove("active");
        $("stepPassword").classList.add("active");
        $("password").value = "";
        $("password").focus();
        hideError();
      }

      // Password submit
      $("passwordForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        hideError();
        const btn = $("btnPassword");
        const pw = $("password").value;
        setLoading(btn, true);

        const username = $("username").value.trim();

        try {
          const res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password: pw })
          });
          const data = await res.json();

          if (data.success) {
            window.location.href = "/";
            return;
          }

          if (data.needs2FA) {
            savedUsername = username;
            savedPassword = pw;
            $("stepPassword").classList.remove("active");
            $("step2FA").classList.add("active");
            $("totp").value = "";
            $("totp").focus();
            setLoading(btn, false);
            return;
          }

          showError(data.error || "Giriş başarısız");
        } catch (ex) {
          showError("Sunucuya bağlanılamadı");
        }

        setLoading(btn, false);
      });

      // 2FA submit
      $("totpForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        hideError();
        const btn = $("btn2FA");
        const code = $("totp").value;
        if (code.length !== 6) return;
        setLoading(btn, true);

        try {
          const res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: savedUsername, password: savedPassword, totp: code })
          });
          const data = await res.json();

          if (data.success) {
            window.location.href = "/";
            return;
          }

          showError(data.error || "Doğrulama başarısız");
        } catch (ex) {
          showError("Sunucuya bağlanılamadı");
        }

        setLoading(btn, false);
      });

      // Auto-submit when 6 digits entered
      $("totp").addEventListener("input", (e) => {
        e.target.value = e.target.value.replace(/\D/g, "").slice(0, 6);
        if (e.target.value.length === 6) {
          $("totpForm").dispatchEvent(new Event("submit"));
        }
      });

      // Enter key submits form
      $("password").addEventListener("keydown", (e) => {
        if (e.key === "Enter") $("passwordForm").dispatchEvent(new Event("submit"));
      });
      $("username").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          $("password").focus();
        }
      });
    </script>
  </body>
</html>
